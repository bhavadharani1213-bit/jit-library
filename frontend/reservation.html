<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Library Dashboard • Reserve Books</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    :root {
      --blue1:#1e3c72;
      --blue2:#2a5298;
      --radius:12px;
      --shadow:0 16px 40px rgba(0,0,0,0.08);
      --card:#fff;
      --bg: linear-gradient(135deg,var(--blue1),var(--blue2));
      --text:#1f2d46;
    }
    *{box-sizing:border-box;}
    body {
      margin:0;
      font-family: "Segoe UI", system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
      background: #f0f4fb;
      min-height:100vh;
      color: var(--text);
    }
    .layout {
      max-width: 1200px;
      margin:0 auto;
      padding:16px;
      display:grid;
      grid-template-columns:260px 1fr;
      gap:20px;
    }
    .sidebar {
      display:flex;
      flex-direction:column;
      gap:20px;
    }
    .card {
      background:#fff;
      border-radius:var(--radius);
      padding:18px 22px;
      box-shadow: var(--shadow);
      position: relative;
    }
    .title {
      margin:0;
      font-size:1.75rem;
      font-weight:700;
      color: var(--blue1);
    }
    .section-title {
      display:flex;
      justify-content: space-between;
      align-items:center;
      margin-bottom:12px;
    }
    .btn {
      background: var(--blue2);
      color:#fff;
      border:none;
      padding:10px 16px;
      border-radius:8px;
      cursor:pointer;
      font-weight:600;
      font-size:0.9rem;
      display:inline-flex;
      align-items:center;
      gap:6px;
      transition: filter .2s;
    }
    .btn:hover { filter:brightness(1.1); }
    .small-btn {
      background:#eef3ff;
      border:1px solid #c7d2fe;
      color: var(--blue1);
      padding:6px 14px;
      border-radius:6px;
      cursor:pointer;
      font-size:0.8rem;
    }
    .badge {
      background:#d1e7ff;
      color:#1e3c72;
      padding:4px 10px;
      border-radius:999px;
      font-size:0.65rem;
      display:inline-block;
    }

    /* Reserved sidebar list */
    .reserved-list {
      list-style:none;
      padding:0;
      margin:0;
      display:flex;
      flex-direction:column;
      gap:12px;
    }
    .reserved-item {
      background:#f5f8ff;
      padding:10px 14px;
      border-radius:8px;
      font-size:14px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:8px;
      border:1px solid #c7d2fe;
    }

    /* Available books table */
    table {
      width:100%;
      border-collapse:collapse;
      margin-top:6px;
    }
    th, td {
      padding:12px 10px;
      text-align:left;
      border-bottom:1px solid #e6eaea;
      font-size:14px;
    }
    th {
      background: #f0f6ff;
      position:sticky;
      top:0;
    }
    .reserve-btn {
      background:#10b981;
      color:#fff;
      border:none;
      padding:8px 12px;
      border-radius:6px;
      cursor:pointer;
      font-size:13px;
      font-weight:600;
      transition:.2s;
    }
    .reserve-btn:disabled {
      background:#ccc;
      cursor:default;
    }
    .status {
      font-size:12px;
      padding:4px 10px;
      border-radius:999px;
      display:inline-block;
    }
    .status-available { background:#e6f7e8; color:#157f3b; }
    .status-held { background:#ffe7d9; color:#a65800; }

    /* Success message */
    .toast {
      position:fixed;
      top:20px;
      right:20px;
      background:#22c55e;
      color:#fff;
      padding:14px 22px;
      border-radius:10px;
      box-shadow:0 12px 30px rgba(34,197,94,.4);
      font-weight:600;
      display:none;
      z-index:100;
    }
    .header {
      display:flex;
      justify-content: space-between;
      align-items:center;
      flex-wrap:wrap;
      gap:10px;
      margin-bottom:8px;
    }
    .profile {
      display:flex;
      align-items:center;
      gap:12px;
    }
    .avatar {
      width:40px;
      height:40px;
      border-radius:50%;
      background: #fff;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:700;
      color: var(--blue1);
      border:2px solid var(--blue2);
    }

    @media (max-width: 1000px) {
      .layout { grid-template-columns:1fr; }
      .sidebar { order:2; }
    }
  </style>
</head>
<body>

  <div class="toast" id="toast">Reserved Successfully</div>

  <div style="padding:16px; max-width:1200px; margin:0 auto;">
    <div class="header">
      <div>
        <h1 class="title">JEPPIAAR INSTITUTE OF TECHNOLOGY Library</h1>
        <div style="font-size:14px; color:#555;">Dashboard / Reserve Books</div>
      </div>
      <div class="profile">
        <div class="avatar">D</div>
        <div>
          <div style="font-weight:600;">Deva Dharshini</div>
          <div style="font-size:12px; color:#666;">Student • UG ID: 21CS001</div>
        </div>
      </div>
    </div>

    <div class="layout">
      <!-- Sidebar: My Reserved Books -->
      <div class="sidebar">
        <div class="card">
          <div class="section-title">
            <div>My Reserved Books</div>
            <div style="font-size:12px; color:#888;">(Held / Pending)</div>
          </div>
          <ul class="reserved-list" id="reservedList">
            <!-- filled dynamically -->
          </ul>
          <button class="btn" id="addNew"></button>
        </div>
      </div>

      <!-- Main area: Available books -->
      <div class="main">
        <div class="card">
          <div class="section-title">
            <div style="font-size:18px; font-weight:600;">Available Books</div>
            <div>
              <span class="badge">Search & Reserve</span>
            </div>
          </div>
          <div style="overflow:auto;">
            <table aria-label="Available books">
              <thead>
                <tr>
                  <th>Book Name</th>
                  <th>Author</th>
                  <th>Category</th>
                  <th>Department</th>
                  <th>ISBN</th>
                  <th>eBook URL</th>
                  <th>eBook PDF</th>
                  <th>Publication</th>
                  <th>Action</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody id="availableBody">              
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const user = JSON.parse(localStorage.getItem("user"));
  if (!user || !user.email) {
    alert("Login first!");
    window.location.href = "login.html";
    return;
  }

  const reservedList = document.getElementById("reservedList");
  const availableBody = document.getElementById("availableBody");
  const toast = document.getElementById("toast");

  function showToast(msg) {
    toast.textContent = msg;
    toast.style.display = "block";
    setTimeout(() => (toast.style.display = "none"), 1500);
  }

  // 🔹 Load reserved books (POST /api/reservations/my-books)
  async function loadReserved() {
    try {
      console.log("Fetching reserved books for:", user.email);
      const res = await fetch("http://localhost:5000/api/reservations/my-books", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: user.email }),
      });
      if (!res.ok) throw new Error(`HTTP ${res.status} - ${res.statusText}`);
      const data = await res.json();

      reservedList.innerHTML = "";
      const reserved = data.books?.filter((b) => b.status === "Reserved") || [];

      if (reserved.length === 0) {
        reservedList.innerHTML = `<div style="font-size:13px; color:#555;">No books reserved yet.</div>`;
        return;
      }

      reserved.forEach((b) => {
        const li = document.createElement("li");
        li.className = "reserved-item";
        li.innerHTML = `
          <div>
            <div style="font-weight:600;">${b.title}</div>
            <div style="font-size:12px; color:#555;">Reserved • ${b.status_date_type}</div>
          </div>
          <div>
            <div class="status status-held">Held</div>
          </div>
        `;
        reservedList.appendChild(li);
      });
    } catch (err) {
      console.warn("Reserved books request failed:", err);
    }
  }

  // 🔹 Load available books (unchanged)
  async function loadAvailable() {
    try {
      console.log("Fetching available books from:", "http://localhost:5000/api/books/available");
      const res = await fetch("http://localhost:5000/api/books/available");
      if (!res.ok) throw new Error(`HTTP ${res.status} - ${res.statusText}`);
      const data = await res.json();
      console.log("Available books data:", data);

      availableBody.innerHTML = "";
      if (!data.books || data.books.length === 0) {
        availableBody.innerHTML = `<tr><td colspan="10" style="text-align:center; color:#555;">No books available right now.</td></tr>`;
        return;
      }

      data.books.forEach((book) => {
        const tr = document.createElement("tr");
        tr.dataset.bookId = book.id;

        const ebookUrlCell = book.ebook_url
          ? `<a href="${book.ebook_url}" target="_blank">🌐 View eBook</a>`
          : "—";

        const pdfLinksCell = book.ebook_pdf_link
          ? `
            <div style="display:flex; flex-direction:column; gap:4px;">
              <a href="${book.ebook_pdf_link}" target="_blank">📄 View PDF</a>
              <a href="${book.ebook_pdf_link}" download>⬇ Download PDF</a>
            </div>
          `
          : "—";

        tr.innerHTML = `
          <td>${book.title}</td>
          <td>${book.author}</td>
          <td>${book.isbn || "—"}</td>
          <td>${book.publication || "—"}</td>
          <td>${book.category}</td>
          <td>${book.department}</td>
          <td>${book.available_count}</td>
          <td>${ebookUrlCell}</td>
          <td>${pdfLinksCell}</td>
          <td>
            <span class="status ${book.available_count > 0 ? "status-available" : "status-held"}">
              ${book.available_count > 0 ? `Available (${book.available_count})` : "Held"}
            </span>
          </td>
          <td>
            <button class="reserve-btn" ${book.available_count <= 0 ? "disabled" : ""}>+ Reserve Book</button>
          </td>
        `;
        availableBody.appendChild(tr);
      });

      attachReserveHandlers();
    } catch (err) {
      console.warn("Available books request failed:", err);
    }
  }

  // 🔹 Attach reserve button handlers (unchanged)
  function attachReserveHandlers() {
    document.querySelectorAll(".reserve-btn").forEach((btn) => {
      btn.addEventListener("click", async () => {
        const tr = btn.closest("tr");
        const bookId = tr.dataset.bookId;

        try {
          const res = await fetch("http://localhost:5000/api/reservations/reserve", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              email: user.email,
              book_id: bookId
            }),
          });

          if (!res.ok) throw new Error(`HTTP ${res.status} - ${res.statusText}`);
          const result = await res.json();
          showToast(result.message);

          // refresh lists
          loadReserved();
          loadAvailable();
        } catch (err) {
          alert("Reservation failed: " + err.message);
        }
      });
    });
  }

  // INIT
  loadReserved();
  loadAvailable();
});
</script>



</body>
</html>
