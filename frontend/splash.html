<!DOCTYPE html> 
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Jeppiaar Library • Welcome</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    height: 100vh;
    /* Matching Sky Blue Shades from Login Page */
    background: radial-gradient(circle at bottom, #97EBF4, #52B2BF, #2f74c7);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Segoe UI", sans-serif;
    color: rgb(0, 0, 0);
  }
  .quote {
    font-size: 14px;
    font-style: italic;
    margin-top: 10px;
    color: #000000; /* soft gray text */
  }
    
  /* Background image layer */
  .bg-image {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0.2; /* Adjust for transparency */
    z-index: -2; /* Behind waves */
  }

  /* Animated wave background */
  .waves {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
  }
  .wave {
    position: absolute;
    width: 200%;
    height: 200%;
    background: rgba(255, 255, 255, 0.05);
    border-radius: 43%;
    animation: drift 4s infinite linear;
  }
  .wave:nth-child(2) {
    animation: drift 3.5s infinite linear reverse;
    background: rgba(255, 255, 255, 0.07);
  }
  .wave:nth-child(3) {
    animation: drift 4s infinite linear;
    background: rgba(255, 255, 255, 0.09);
  }
  @keyframes drift {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  /* Splash content */
.splash {
  text-align: center;
  padding: 30px 25px;
  border-radius: 16px;
  background: #ffffff;
  backdrop-filter: blur(12px);
}
  @keyframes zoomIn {
    from { transform: scale(0.8); opacity: 0; }
    to { transform: scale(2); opacity: 5; }
  }
  /* Logo text */
.logo {
  font-size: 20px;
  font-weight: bold;
  color: #000000; /* logo color */
  margin-bottom: 10px;
}
 /* Title text */
.title {
  font-size: 17px;
  font-weight: bold;
  color: #004aad; /* change this to your preferred title color */
}
</style>
</head>
<body>
     <img src="images/clg.JPG" class="bg-image" alt="Background">

<div class="waves">
  <div class="wave"></div>
  <div class="wave"></div>
  <div class="wave"></div>
</div>

<div class="splash" id="splash">
  <div class="logo">JEPPIAAR INSTITUTE OF TECHNOLOGY</div>
  <div class="title">"Self Belief.Self Discipline.Self Respect"</div>
  <div class="quote" id="quote"></div>
</div>

<script>
  
    // Read stored redirect from localStorage
        const redirectPage = localStorage.getItem("redirectAfterSplash");

        if (!redirectPage) {
            // If no redirect found, send to login
            window.location.href = "login.html";
        } else {
            // Delay for splash animation (2 seconds)
            setTimeout(() => {
                window.location.href = redirectPage;
            }, 2000);
        }
    
    const quotes = [
    "“A room without books is like a body without a soul.” – Cicero",
    "“Today a reader, tomorrow a leader.” – Margaret Fuller",
    "“Libraries store the energy that fuels the imagination.” – Sidney Sheldon",
    "“The only thing that you absolutely have to know, is the location of the library.” – Albert Einstein",
    "“Reading is to the mind what exercise is to the body.” – Joseph Addison",
    "“Books are a uniquely portable magic.” – Stephen King",
    "“Once you learn to read, you will be forever free.” – Frederick Douglass",
    "“Libraries are the thin red line between civilization and barbarism.” – Neil Gaiman"
  ];

  document.getElementById("quote").innerText =
    quotes[Math.floor(Math.random() * quotes.length)];
</script>

</body>
</html>
