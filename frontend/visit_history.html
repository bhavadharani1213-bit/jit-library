<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Visit History</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #e3f2fd, #ffffff);
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 900px;
            margin: 50px auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            padding: 30px;
        }

        h2 {
            text-align: center;
            color: #1976d2;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 25px;
        }

        th, td {
            padding: 14px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #1976d2;
            color: white;
        }

        tr:hover {
            background-color: #f1f1f1;
        }

        .back-btn {
            display: inline-block;
            margin-top: 20px;
            text-decoration: none;
            background: #1976d2;
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
            transition: background 0.3s;
        }

        .back-btn:hover {
            background: #125ea7;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Visit History</h2>
        <table>
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Time In</th>
                    <th>Time Out</th>
                
                </tr>
            </thead>
            <tbody id="visitTableBody">
                <tr>
                    <td colspan="5">Loading...</td>
                </tr>
            </tbody>
        </table>

        <a href="dashboard.html" class="back-btn">← Back to Dashboard</a>
    </div>
<script>
document.addEventListener("DOMContentLoaded", async () => {
    const user = JSON.parse(localStorage.getItem("user"));

    if (!user || !user.email) {
        alert("Please log in first!");
        window.location.href = "login.html";
        return;
    }

    try {
        const res = await fetch(`http://127.0.0.1:5000/api/visit/history?email=${encodeURIComponent(user.email)}`);
        const data = await res.json();

        const tbody = document.getElementById("visitTableBody");
        tbody.innerHTML = "";

        if (data.visits && data.visits.length > 0) {
            data.visits.forEach(v => {
                const row = `
                    <tr>
                        <td>${v.date || "N/A"}</td>
                        <td>${v.time_in || "N/A"}</td>
                        <td>${v.time_out || "N/A"}</td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });
        } else {
            tbody.innerHTML = `<tr><td colspan="3">No visit history found.</td></tr>`;
        }

    } catch (err) {
        console.error("Error loading visit history:", err);
        document.getElementById("visitTableBody").innerHTML =
            `<tr><td colspan="3">Error fetching data</td></tr>`;
    }
});
</script>

</body>
</html>
